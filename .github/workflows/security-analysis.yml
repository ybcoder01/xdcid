name: Contract security analysis

on:
  pull_request:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  slither:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.7.0
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Compile contracts
        run: pnpm compile
      - name: Install pinned Slither
        run: |
          python3 -m venv .slither-venv
          .slither-venv/bin/pip install slither-analyzer==0.11.6
      - name: Run Slither
        run: |
          set +e
          .slither-venv/bin/slither . \
            --compile-force-framework hardhat \
            --exclude-dependencies \
            --json slither-report.json
          status=$?
          set -e
          if [ ! -s slither-report.json ]; then
            exit "$status"
          fi
          node scripts/check-slither-report.mjs slither-report.json
