name: Verify Subdomain Registrar on Apothem

on:
  workflow_dispatch:
    inputs:
      subdomain_registrar:
        description: Subdomain Registrar address
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.7.0
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Select synchronized Apothem RPC
        env:
          CONTRACT_ADDRESS: ${{ inputs.subdomain_registrar }}
        run: |
          for rpc in \
            https://rpc.apothem.network \
            https://erpc.apothem.network \
            https://apothem.xdcrpc.com
          do
            code="$(curl --fail --silent --show-error --max-time 15 \
              --header 'content-type: application/json' \
              --data "{\"jsonrpc\":\"2.0\",\"method\":\"eth_getCode\",\"params\":[\"$CONTRACT_ADDRESS\",\"latest\"],\"id\":1}" \
              "$rpc" | jq -r '.result // empty')" || continue
            if [ -n "$code" ] && [ "$code" != "0x" ]; then
              echo "APOTHEM_RPC_URL=$rpc" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "No configured Apothem RPC can read deployed bytecode" >&2
          exit 1
      - name: Verify and publish contract
        env:
          APOTHEM_RPC_URL: ${{ env.APOTHEM_RPC_URL }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          XDCSCAN_API_KEY: ${{ secrets.XDCSCAN_API_KEY }}
          SUBDOMAIN_REGISTRAR_ADDRESS: ${{ inputs.subdomain_registrar }}
        run: pnpm verify:subdomain:apothem
