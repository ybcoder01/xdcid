name: Read-only mainnet activation preflight

on:
  push:
    branches:
      - verify/mainnet-activation-preflight
  pull_request:
    paths:
      - ".github/workflows/preflight-mainnet-activation.yml"
      - "scripts/preflight-mainnet-pricing-stack-readonly.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Run read-only preflight
        env:
          XDC_MAINNET_RPC_URL: https://earpc.xinfin.network
          EXPECTED_REGISTRY_OWNER: "0xe82a4267CC310FC6Db334601671A043DFc8Ce06A"
          EXPECTED_CURRENT_REGISTRAR: "0x6955Be33d0B414784F9d3a6E71BAc1bb9B376cD7"
          REGISTRY_ADDRESS: "0x05fa64a05bc205DeDF47e023d2D90c2d119cd097"
          NEW_SIGNED_REGISTRAR: "0xa1584cb17523CEb991155328EdFAD2293b66bd94"
          PRICING_POLICY_ADDRESS: "0xCdAFe55B0F34eBa2b3a4C8b6d41c2810B5458426"
          LEGACY_REGISTRY_ADDRESS: "0x295a7aB79368187a6CD03c464cfaAb04d799784E"
          QUOTE_SIGNER: "0xe82a4267CC310FC6Db334601671A043DFc8Ce06A"
          USDC_ADDRESS: "0xfA2958CB79b0491CC627c1557F441eF849Ca8eb1"
          TREASURY_ADDRESS: "0xe82a4267CC310FC6Db334601671A043DFc8Ce06A"
        run: pnpm hardhat run scripts/preflight-mainnet-pricing-stack-readonly.ts --network xdc
