name: Apothem Unified V3 monitor

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.7.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.1
          cache: pnpm
      - name: Verify secure Node.js runtime
        run: node scripts/check-node-security-version.mjs
      - run: pnpm install --frozen-lockfile
      - name: Verify Apothem contracts and dev readiness
        run: node scripts/monitor-apothem-unified-v3.mjs
        env:
          XDCID_DEV_URL: https://dev.xdcid.xyz
          APOTHEM_RPC_URL: https://rpc.apothem.network
          EXPECT_UNIFIED_READY: "true"
