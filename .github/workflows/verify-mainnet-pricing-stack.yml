name: Verify mainnet pricing stack

on:
  push:
    branches:
      - verify/mainnet-pricing-stack
    paths:
      - ".github/workflows/verify-mainnet-pricing-stack.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify pricing policy and signed registrar
        env:
          XDCSCAN_API_KEY: ${{ secrets.XDCSCAN_API_KEY }}
          XDC_MAINNET_RPC_URL: https://earpc.xinfin.network
          PRICING_POLICY_ADDRESS: "0xCdAFe55B0F34eBa2b3a4C8b6d41c2810B5458426"
          NEW_SIGNED_REGISTRAR: "0xa1584cb17523CEb991155328EdFAD2293b66bd94"
          REGISTRY_ADDRESS: "0x05fa64a05bc205DeDF47e023d2D90c2d119cd097"
          LEGACY_REGISTRY_ADDRESS: "0x295a7aB79368187a6CD03c464cfaAb04d799784E"
          POLICY_OWNER: "0xe82a4267CC310FC6Db334601671A043DFc8Ce06A"
          QUOTE_SIGNER: "0xe82a4267CC310FC6Db334601671A043DFc8Ce06A"
          USDC_ADDRESS: "0xfA2958CB79b0491CC627c1557F441eF849Ca8eb1"
          TREASURY_ADDRESS: "0xe82a4267CC310FC6Db334601671A043DFc8Ce06A"
        run: |
          if [ -z "$XDCSCAN_API_KEY" ]; then
            echo "XDCSCAN_API_KEY repository secret is required"
            exit 1
          fi
          pnpm verify:pricing-stack:xdc
