name: Verify Registrar v2 on Apothem

on:
  workflow_dispatch:
    inputs:
      pricing_policy_v2:
        description: Pricing Policy v2 address
        required: true
        type: string
      discount_authorization:
        description: Discount Authorization address
        required: true
        type: string
      registrar_v2:
        description: Registrar v2 address
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.7.0
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Select synchronized Apothem RPC
        env:
          CONTRACT_ADDRESS: ${{ inputs.pricing_policy_v2 }}
        run: |
          for rpc in \
            https://rpc.apothem.network \
            https://erpc.apothem.network \
            https://apothem.xdcrpc.com
          do
            code="$(curl --fail --silent --show-error --max-time 15 \
              --header 'content-type: application/json' \
              --data "{\"jsonrpc\":\"2.0\",\"method\":\"eth_getCode\",\"params\":[\"$CONTRACT_ADDRESS\",\"latest\"],\"id\":1}" \
              "$rpc" | jq -r '.result // empty')" || continue
            if [ -n "$code" ] && [ "$code" != "0x" ]; then
              echo "APOTHEM_RPC_URL=$rpc" >> "$GITHUB_ENV"
              echo "Selected synchronized Apothem RPC: $rpc"
              exit 0
            fi
          done
          echo "No configured Apothem RPC can read deployed bytecode" >&2
          exit 1
      - name: Verify and publish contracts
        env:
          APOTHEM_RPC_URL: ${{ env.APOTHEM_RPC_URL }}
          XDCSCAN_API_KEY: ${{ secrets.XDCSCAN_API_KEY }}
          PRICING_POLICY_V2_ADDRESS: ${{ inputs.pricing_policy_v2 }}
          DISCOUNT_AUTHORIZATION_ADDRESS: ${{ inputs.discount_authorization }}
          REGISTRAR_V2_ADDRESS: ${{ inputs.registrar_v2 }}
        run: pnpm verify:registrar-v2:apothem
