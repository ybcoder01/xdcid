name: Verify Registrar v2 on Apothem

on:
  workflow_dispatch:
    inputs:
      pricing_policy_v2:
        description: Pricing Policy v2 address
        required: true
        type: string
      discount_authorization:
        description: Discount Authorization address
        required: true
        type: string
      registrar_v2:
        description: Registrar v2 address
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.7.0
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify and publish contracts
        env:
          APOTHEM_RPC_URL: https://rpc.apothem.network
          XDCSCAN_API_KEY: ${{ secrets.XDCSCAN_API_KEY }}
          PRICING_POLICY_V2_ADDRESS: ${{ inputs.pricing_policy_v2 }}
          DISCOUNT_AUTHORIZATION_ADDRESS: ${{ inputs.discount_authorization }}
          REGISTRAR_V2_ADDRESS: ${{ inputs.registrar_v2 }}
        run: pnpm verify:registrar-v2:apothem
